# ブラウザから直接開かせないフォルダ・ファイル（require では普通に読める）
<DirectoryMatch "^/var/www/html/(common|sql|lib|tools|docs|docker|template|\.github)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(Dockerfile|composer\.(json|lock)|railway\.json|.*\.md|.*\.bat|\..*)$">
    Require all denied
</FilesMatch>

# 商品写真フォルダでは PHP を実行しない
<Directory "/var/www/html/img">
    php_admin_flag engine off
</Directory>

DirectoryIndex index.php
ServerTokens Prod
ServerSignature Off
